name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: tags give build-app.sh a real version instead of
          # 0.0.0-dev, and the commit count is the build number.
          fetch-depth: 0

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Swift version
        run: swift --version

      # Strict concurrency is a warning in the Swift 5 language mode, so the
      # build log is checked: any concurrency warning in the app's own code or
      # tests fails the job. Dependencies are not checked.
      - name: Build (strict concurrency)
        run: |
          set -o pipefail
          swift build --build-tests -Xswiftc -strict-concurrency=complete 2>&1 | tee "$RUNNER_TEMP/build.log"
          if grep -E '(Sources/StickyNotes(Kit)?|Tests/StickyNotesTests)/.*: warning: .*(Swift 6 language mode|actor-isolated|Sendable|nonisolated|preconcurrency|data races)' "$RUNNER_TEMP/build.log"; then
            echo "Strict concurrency warnings found in the app or its tests." >&2
            exit 1
          fi

      - name: Test
        run: swift test --skip-build

      - name: Build release app bundle
        run: ./scripts/build-app.sh

      - name: Check the build number was stamped
        run: |
          expected="$(git rev-list --count HEAD)"
          actual="$(plutil -extract CFBundleVersion raw build/StickyNotes.app/Contents/Info.plist)"
          if [ "${actual}" != "${expected}" ]; then
            echo "CFBundleVersion is '${actual}', expected '${expected}'" >&2
            exit 1
          fi
